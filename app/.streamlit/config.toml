[theme]
# Dark purple theme. Chart colours (blue #3987e5, orange #d95926) and the violet accent were checked with the
# dataviz palette validator against this background: colour-blind separation and contrast all pass.
# NOTE: this file is shared by every page in app/, including app_bq2.py. Agree with the BQ2 team before merging.
base = "dark"
primaryColor = "#9085e9"
backgroundColor = "#15111f"
secondaryBackgroundColor = "#221b33"
textColor = "#ece8f4"
baseFontSize = 20
# headings keep their usual size; only the body text grows
headingFontSizes = ["44px", "34px", "28px", "24px", "21px", "20px"]
