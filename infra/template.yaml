AWSTemplateFormatVersion: "2010-09-09"
Description: IS459 G1T4 AML pipeline

Parameters:
  ProjectPrefix:
    Type: String
    Default: is459-g1t4-aml

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectPrefix}-datalake-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SchemesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectPrefix}-schemes"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: scheme_id, AttributeType: S }
        - { AttributeName: txn_key, AttributeType: S }
      KeySchema:
        - { AttributeName: scheme_id, KeyType: HASH }
        - { AttributeName: txn_key, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: by_txn_key
          KeySchema:
            - { AttributeName: txn_key, KeyType: HASH }
          Projection:
            ProjectionType: ALL

  # TODO: Glue database + crawlers, Glue jobs, IAM role, Athena workgroup,
  #       Step Functions state machine, EventBridge rule, SNS topic

Outputs:
  DataLakeBucketName:
    Value: !Ref DataLakeBucket
  SchemesTableName:
    Value: !Ref SchemesTable
